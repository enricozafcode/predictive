<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Predictive Analytics Exam Trainer</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --success: #10B981;
            --error: #EF4444;
            --border: #E5E7EB;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* 🐸 Crazy Frog Animation */
        #frog-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            pointer-events: none;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: crazyFrog 2.5s forwards ease-in-out;
        }

        .frog-emoji { font-size: 8rem; }
        .frog-text { 
            font-size: 3rem; 
            font-weight: bold; 
            color: var(--success); 
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff; 
        }

        @keyframes crazyFrog {
            0% { transform: scale(0) rotate(-180deg) translate(-500px, 500px); opacity: 0; }
            20% { transform: scale(2) rotate(20deg) translate(0, 0); opacity: 1; }
            40% { transform: scale(1.5) rotate(-20deg); opacity: 1; }
            60% { transform: scale(3) rotate(720deg); opacity: 1; }
            100% { transform: scale(10) rotate(1440deg); opacity: 0; visibility: hidden; }
        }

        /* Sidebar Styles */
        #sidebar {
            width: 260px;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        #sidebar.hidden {
            transform: translateX(-100%);
            position: absolute;
            height: 100%;
            z-index: 10;
        }

        .sidebar-header {
            font-size: 1.25rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            color: var(--primary);
        }

        .tag-list { list-style: none; overflow-y: auto; flex-grow: 1; }

        .tag-item {
            padding: 0.75rem 1rem;
            margin-bottom: 0.5rem;
            background-color: var(--bg-color);
            border-radius: 0.5rem;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
        }

        .tag-item:hover, .tag-item.active {
            background-color: var(--primary);
            color: white;
        }

        .tag-count {
            background: rgba(0,0,0,0.1);
            padding: 0.1rem 0.4rem;
            border-radius: 1rem;
            font-size: 0.75rem;
        }

        /* Main Content Styles */
        #main {
            flex-grow: 1;
            padding: 2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            padding: 2rem;
            margin-top: 1rem;
        }

        .inline-card {
            border: 1px solid var(--border);
            box-shadow: none;
            margin-top: 1.5rem;
            padding: 1.5rem;
        }

        /* Views */
        .view { display: none; width: 100%; max-width: 800px; }
        .view.active { display: block; }

        hr { border: 0; border-top: 2px dashed var(--border); margin: 2.5rem 0; }

        /* Setup View */
        .setup-controls {
            display: flex;
            align-items: flex-end;
            gap: 1.5rem;
            margin-top: 1.5rem;
        }

        .input-group { display: flex; flex-direction: column; gap: 0.5rem; flex-grow: 1; }

        /* Buttons & Inputs */
        button {
            background-color: var(--primary); color: white; border: none;
            padding: 0.75rem 1.5rem; border-radius: 0.5rem; cursor: pointer;
            font-weight: 600; font-size: 1rem; transition: background-color 0.2s;
        }

        button:hover { background-color: var(--primary-hover); }
        button:disabled { background-color: var(--text-muted); cursor: not-allowed; }

        .btn-outline { background-color: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover { background-color: var(--primary); color: white; }
        
        .btn-danger { background-color: transparent; color: var(--error); border: 2px solid var(--error); }
        .btn-danger:hover { background-color: var(--error); color: white; }

        input[type="number"], input[type="text"], textarea {
            padding: 0.75rem; border: 1px solid var(--border); border-radius: 0.5rem;
            font-size: 1rem; width: 100%;
        }

        /* Question Elements */
        .question-header {
            display: flex; justify-content: space-between; color: var(--text-muted);
            font-size: 0.9rem; margin-bottom: 1rem;
        }

        .question-tags { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .question-tag {
            background: #E0E7FF; color: #3730A3; padding: 0.2rem 0.5rem;
            border-radius: 0.25rem; font-size: 0.75rem;
        }

        .question-text { font-size: 1.15rem; font-weight: 600; margin-bottom: 1.5rem; line-height: 1.5; }
        .question-image { max-width: 100%; border-radius: 0.5rem; margin-bottom: 1.5rem; display: none; }

        /* Multiple Choice */
        .mc-options { display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem; }
        .mc-option {
            padding: 1rem; border: 1px solid var(--border); border-radius: 0.5rem;
            cursor: pointer; transition: all 0.2s; background: var(--card-bg);
            text-align: left; font-weight: 400; color: var(--text-main); width: 100%;
        }
        .mc-option:hover:not(:disabled) { border-color: var(--primary); background-color: #EEF2FF; }
        .mc-option.correct { background-color: #D1FAE5; border-color: var(--success); color: #065F46; }
        .mc-option.incorrect { background-color: #FEE2E2; border-color: var(--error); color: #991B1B; }

        /* Hint and Solution */
        .hint-box, .solution-box { margin-top: 1rem; padding: 1rem; border-radius: 0.5rem; display: none; }
        .hint-box { background-color: #FFFBEB; border-left: 4px solid #F59E0B; }
        .solution-box { background-color: #ECFDF5; border-left: 4px solid var(--success); }

        .action-buttons { display: flex; gap: 1rem; margin-top: 1.5rem; flex-wrap: wrap; }
        .feedback-text { font-weight: bold; margin-top: 1rem; }
        .text-success { color: var(--success); }
        .text-error { color: var(--error); }
        .text-muted { color: var(--text-muted); }

        /* Top Bar */
        .top-bar { width: 100%; max-width: 800px; display: flex; justify-content: flex-start; margin-bottom: 1rem; }
        #toggle-sidebar { display: none; }
    </style>

        // ==========================================
        // APP STATE & ELEMENTS
        // ==========================================
        let currentPool = [];
        let activeQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let scoreableQuestions = 0;
        let selectedTopic = null;
        let answeredCurrent = false;

        const sidebar = document.getElementById('sidebar');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar');
        const tagList = document.getElementById('tag-list');
        const setupView = document.getElementById('setup-view');
        const quizView = document.getElementById('quiz-view');
        const resultView = document.getElementById('result-view');
        const selectedTopicText = document.getElementById('selected-topic-text');
        const inlineCountText = document.getElementById('inline-count-text');
        const numQuestionsInput = document.getElementById('num-questions');
        const inlineContainer = document.getElementById('inline-questions-container');

        function renderMath() {
    if (window.MathJax) {
        MathJax.typesetPromise().catch((err) => console.log('MathJax error:', err.message));
    }
}

        // ==========================================
        // INITIALIZATION
        // ==========================================
        function init() {
            // Clean up frog overlay after animation
            setTimeout(() => document.getElementById('frog-overlay').remove(), 3000);

            // Extract tags and count frequencies
            const tagCounts = {};
            questionsData.forEach(q => {
                q.tags.forEach(t => {
                    tagCounts[t] = (tagCounts[t] || 0) + 1;
                });
            });

            // Build sidebar
            tagList.innerHTML = `
                <li class="tag-item active" data-tag="all">
                    <span>All Topics (Random)</span>
                    <span class="tag-count">${questionsData.length}</span>
                </li>`;
            
            Object.keys(tagCounts).sort().forEach(tag => {
                tagList.innerHTML += `
                    <li class="tag-item" data-tag="${tag}">
                        <span>${tag}</span>
                        <span class="tag-count">${tagCounts[tag]}</span>
                    </li>`;
            });

            // Sidebar click events
            document.querySelectorAll('.tag-item').forEach(item => {
                item.addEventListener('click', (e) => {
                    const target = e.currentTarget;
                    const tag = target.getAttribute('data-tag');
                    
                    // Prevent changing topic if in an active quiz and user declines cancel
                    if (quizView.classList.contains('active')) {
                        if (!confirm("You are currently in an active quiz. Do you want to cancel it to change topics?")) {
                            return;
                        }
                        resetApp(); // Leaves quiz view, goes back to setup view
                    }

                    document.querySelectorAll('.tag-item').forEach(el => el.classList.remove('active'));
                    target.classList.add('active');
                    
                    selectedTopic = tag === 'all' ? null : tag;
                    
                    updateSetupView();
                    hideSidebar();
                });
            });

            // Setup listeners
            document.getElementById('start-btn').addEventListener('click', startSession);
            document.getElementById('cancel-quiz-btn').addEventListener('click', () => {
                if (confirm("Are you sure you want to cancel the current quiz?")) resetApp();
            });
            
            // Quiz listeners
            document.getElementById('hint-btn').addEventListener('click', () => {
                document.getElementById('hint-container').style.display = 'block';
            });
            document.getElementById('check-btn').addEventListener('click', checkAnswer);
            document.getElementById('next-btn').addEventListener('click', nextQuestion);
            document.getElementById('restart-btn').addEventListener('click', resetApp);
            
            toggleSidebarBtn.addEventListener('click', () => {
                sidebar.classList.remove('hidden');
                toggleSidebarBtn.style.display = 'none';
            });

            // Render initial state
            updateSetupView();
        }

        // ==========================================
        // CORE LOGIC
        // ==========================================
        function hideSidebar() {
            if (window.innerWidth <= 768) { // Only auto-hide on smaller screens naturally, but forcing it per user request
                sidebar.classList.add('hidden');
                toggleSidebarBtn.style.display = 'block';
            }
        }

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function updateSetupView() {
            // Filter pool
            currentPool = selectedTopic 
                ? questionsData.filter(q => q.tags.includes(selectedTopic))
                : [...questionsData];

            // Update Text & Limits
            const topicName = selectedTopic ? `${selectedTopic} (${currentPool.length})` : `All Topics (${currentPool.length})`;
            selectedTopicText.innerText = `Topic: ${topicName}`;
            inlineCountText.innerText = `Showing ${currentPool.length} question(s) below.`;
            
            numQuestionsInput.max = currentPool.length;
            numQuestionsInput.value = Math.min(5, currentPool.length); // Default to 5 or max available

            renderInlineQuestions(currentPool);
        }

        // ==========================================
        // INLINE PRACTICE LOGIC
        // ==========================================
        function renderInlineQuestions(pool) {
            inlineContainer.innerHTML = '';
            
            pool.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'card inline-card';
                
                // Header & Tags
                let html = `
                    <div class="question-header">
                        <div class="question-tags">${q.tags.map(t => `<span class="question-tag">${t}</span>`).join('')}</div>
                    </div>
                `;

                // Image & Question
                if (q.image) html += `<img class="question-image" src="${q.image}" style="display:block;">`;
                html += `<div class="question-text">${q.question}</div>`;

                // Input Area
                html += `<div class="input-area" id="inline-input-${index}">`;
                if (q.type === 'numeric') {
                    html += `<input type="number" id="inline-num-${index}" step="any" placeholder="Enter numeric answer...">`;
                } else if (q.type === 'text') {
                    html += `<textarea id="inline-text-${index}" rows="3" placeholder="Type your thoughts here..."></textarea>`;
                }
                html += `</div>`; // Close input area

                // Feedback, Hint, Solution Areas
                html += `
                    <div id="inline-feedback-${index}" class="feedback-text"></div>
                    <div id="inline-hint-${index}" class="hint-box"><strong>Hint:</strong> ${q.hint || 'No hint.'}</div>
                    <div id="inline-solution-${index}" class="solution-box"><strong>Solution:</strong> ${Array.isArray(q.solution) ? q.solution.join(", ") : q.solution}</div>
                    <div class="action-buttons">
                        <button id="inline-btn-hint-${index}" class="btn-outline">Show Hint</button>
                        ${q.type !== 'mc' ? `<button id="inline-btn-check-${index}">${q.type === 'text' ? 'Show Solution' : 'Check Answer'}</button>` : ''}
                    </div>
                `;

                card.innerHTML = html;
                inlineContainer.appendChild(card);

                // Attach MC buttons dynamically if needed
                if (q.type === 'mc') {
                    const inputArea = card.querySelector(`#inline-input-${index}`);
                    const optionsDiv = document.createElement('div');
                    optionsDiv.className = 'mc-options';
                    
                    const shuffledOptions = shuffle([...q.options]);
                    shuffledOptions.forEach(opt => {
                        const btn = document.createElement('button');
                        btn.className = 'mc-option';
                        btn.innerText = opt;
                        btn.onclick = () => handleInlineMC(btn, opt, q, index, optionsDiv);
                        optionsDiv.appendChild(btn);
                    });
                    inputArea.appendChild(optionsDiv);
                }

                // Attach Event Listeners
                card.querySelector(`#inline-btn-hint-${index}`).onclick = () => {
                    card.querySelector(`#inline-hint-${index}`).style.display = 'block';
                };

                const checkBtn = card.querySelector(`#inline-btn-check-${index}`);
                if (checkBtn) {
                    checkBtn.onclick = () => handleInlineCheck(q, index, card, checkBtn);
                }
            });
            renderMath();
        }

        function handleInlineMC(selectedBtn, selectedValue, q, index, optionsContainer) {
            const allButtons = optionsContainer.querySelectorAll('.mc-option');
            allButtons.forEach(b => b.disabled = true); // Lock answers

            const feedback = document.getElementById(`inline-feedback-${index}`);
            if (selectedValue === q.solution) {
                selectedBtn.classList.add('correct');
                feedback.innerText = "Correct!";
                feedback.className = "feedback-text text-success";
            } else {
                selectedBtn.classList.add('incorrect');
                feedback.innerText = "Incorrect.";
                feedback.className = "feedback-text text-error";
                // Highlight correct
                allButtons.forEach(b => {
                    if (b.innerText === q.solution) b.classList.add('correct');
                });
            }
            document.getElementById(`inline-solution-${index}`).style.display = 'block';
        }

        function handleInlineCheck(q, index, card, btn) {
            const feedback = document.getElementById(`inline-feedback-${index}`);
            
            if (q.type === 'numeric') {
                const userVal = document.getElementById(`inline-num-${index}`).value;
                if (userVal === '') return;
                
                if (Math.abs(parseFloat(userVal) - parseFloat(q.solution)) < 0.001) {
                    feedback.innerText = "Correct!";
                    feedback.className = "feedback-text text-success";
                } else {
                    feedback.innerText = "Incorrect.";
                    feedback.className = "feedback-text text-error";
                }
            } else if (q.type === 'text') {
                feedback.innerText = "Compare your answer below.";
                feedback.className = "feedback-text text-muted";
            }

            document.getElementById(`inline-solution-${index}`).style.display = 'block';
            btn.disabled = true;
        }


        // ==========================================
        // FORMAL QUIZ LOGIC
        // ==========================================
        function startSession() {
            shuffle(currentPool);
            const requestedNum = parseInt(numQuestionsInput.value, 10);
            activeQuestions = currentPool.slice(0, requestedNum);

            if (activeQuestions.length === 0) {
                alert("No questions available!");
                return;
            }

            currentIndex = 0;
            score = 0;
            scoreableQuestions = 0;
            hideSidebar();

            setupView.classList.remove('active');
            quizView.classList.add('active');
            
            renderQuizQuestion();
        }

        function renderQuizQuestion() {
            answeredCurrent = false;
            const q = activeQuestions[currentIndex];
            
            document.getElementById('progress-text').innerText = `Question ${currentIndex + 1} of ${activeQuestions.length}`;
            document.getElementById('current-tags').innerHTML = q.tags.map(t => `<span class="question-tag">${t}</span>`).join('');
            document.getElementById('question-text').innerText = q.question;
            
            const imgEl = document.getElementById('question-image');
            if (q.image) {
                imgEl.src = q.image; imgEl.style.display = 'block';
            } else {
                imgEl.style.display = 'none'; imgEl.src = "";
            }

            document.getElementById('hint-container').style.display = 'none';
            document.getElementById('hint-text').innerText = q.hint || "No hint available.";
            
            document.getElementById('solution-container').style.display = 'none';
            document.getElementById('solution-text').innerText = Array.isArray(q.solution) ? q.solution.join(", ") : q.solution;

            const inputArea = document.getElementById('input-area');
            const checkBtn = document.getElementById('check-btn');
            const nextBtn = document.getElementById('next-btn');
            const feedbackText = document.getElementById('feedback-text');
            
            inputArea.innerHTML = '';
            feedbackText.innerHTML = '';
            feedbackText.className = 'feedback-text';
            checkBtn.style.display = 'block';
            checkBtn.innerText = q.type === 'text' ? 'Show Solution' : 'Check Answer';
            checkBtn.disabled = false;
            nextBtn.style.display = 'none';

            if (q.type === 'numeric') {
                inputArea.innerHTML = `<input type="number" id="quiz-input-num" step="any" placeholder="Enter your numeric answer here...">`;
            } else if (q.type === 'text') {
                inputArea.innerHTML = `<textarea id="quiz-input-text" rows="4" placeholder="Type your thoughts here..."></textarea>`;
            } else if (q.type === 'mc') {
                checkBtn.style.display = 'none';
                const optionsDiv = document.createElement('div');
                optionsDiv.className = 'mc-options';
                
                shuffle([...q.options]).forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'mc-option';
                    btn.innerText = opt;
                    btn.onclick = () => handleQuizMC(btn, opt, q.solution);
                    optionsDiv.appendChild(btn);
                });
                inputArea.appendChild(optionsDiv);
            }
            renderMath();
        }

        function handleQuizMC(selectedBtn, selectedValue, correctValue) {
            if (answeredCurrent) return;
            answeredCurrent = true;
            scoreableQuestions++;

            const allButtons = document.querySelectorAll('#quiz-view .mc-option');
            allButtons.forEach(btn => btn.disabled = true);

            const feedbackText = document.getElementById('feedback-text');

            if (selectedValue === correctValue) {
                selectedBtn.classList.add('correct');
                score++;
                feedbackText.innerText = "Correct!";
                feedbackText.className = "feedback-text text-success";
            } else {
                selectedBtn.classList.add('incorrect');
                feedbackText.innerText = "Incorrect.";
                feedbackText.className = "feedback-text text-error";
                allButtons.forEach(btn => {
                    if (btn.innerText === correctValue) btn.classList.add('correct');
                });
            }

            document.getElementById('solution-container').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function checkAnswer() {
            if (answeredCurrent) return;
            const q = activeQuestions[currentIndex];
            const feedbackText = document.getElementById('feedback-text');
            const checkBtn = document.getElementById('check-btn');

            if (q.type === 'numeric') {
                const userVal = document.getElementById('quiz-input-num').value;
                if (userVal === '') return;
                
                answeredCurrent = true;
                scoreableQuestions++;
                
                if (Math.abs(parseFloat(userVal) - parseFloat(q.solution)) < 0.001) {
                    score++;
                    feedbackText.innerText = "Correct!";
                    feedbackText.className = "feedback-text text-success";
                } else {
                    feedbackText.innerText = `Incorrect.`;
                    feedbackText.className = "feedback-text text-error";
                }
            } else if (q.type === 'text') {
                answeredCurrent = true;
                feedbackText.innerText = "Compare your answer with the solution below.";
                feedbackText.className = "feedback-text text-muted";
            }

            checkBtn.disabled = true;
            document.getElementById('solution-container').style.display = 'block';
            document.getElementById('next-btn').style.display = 'block';
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex >= activeQuestions.length) {
                endSession();
            } else {
                renderQuizQuestion();
            }
        }

        function endSession() {
            quizView.classList.remove('active');
            resultView.classList.add('active');

            const scoreDisplay = document.getElementById('final-score');
            if (scoreableQuestions > 0) {
                const percentage = Math.round((score / scoreableQuestions) * 100);
                scoreDisplay.innerText = `${percentage}%`;
                scoreDisplay.innerHTML += `<div style="font-size: 1.5rem; color: var(--text-muted); margin-top: 1rem;">${score} out of ${scoreableQuestions} correct</div>`;
            } else {
                scoreDisplay.innerText = "N/A";
                scoreDisplay.innerHTML += `<div style="font-size: 1.5rem; color: var(--text-muted); margin-top: 1rem;">No auto-graded questions answered.</div>`;
            }
        }

        function resetApp() {
            quizView.classList.remove('active');
            resultView.classList.remove('active');
            setupView.classList.add('active');
            updateSetupView(); // Refresh inputs just in case
        }

        // Start app
        init();
    </script>
